* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--ground); color: var(--ink); font: 16px/1.5 var(--font); -webkit-text-size-adjust: 100%; }
.app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--page); display: flex; flex-direction: column; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.25; margin: 0; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1.02rem; }
p { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--navy); color: var(--navy-ink); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; }
.brand { display: inline-flex; align-items: center; gap: 12px; font-weight: 700; font-size: 1.2rem; white-space: nowrap; color: var(--navy-ink); text-decoration: none; min-width: 0; }
.brand-name { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; }
.logo { flex: 0 0 auto; width: 36px; height: 36px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 18px; line-height: 1;
  background: linear-gradient(170deg, var(--sun-1) 0%, var(--sun-2) 45%, var(--sun-3) 78%, var(--sun-4) 100%); box-shadow: inset 0 -2px 6px rgba(60, 20, 50, .25); }
.logo-lg { width: 72px; height: 72px; font-size: 36px; }
.logo img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
/* full lockup (phone + ConnectLA wordmark + roots) */
.logo-lock { width: min(215px, 62%); height: auto; display: block; }
:root[data-theme="dark"] .logo-lock { background: #fdfaf4; border-radius: 18px; padding: 10px 12px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo-lock { background: #fdfaf4; border-radius: 18px; padding: 10px 12px; } }
.top-actions { display: flex; gap: 8px; }
.pill-btn { background: transparent; color: var(--navy-ink); border: 1.5px solid rgba(255,255,255,.75); border-radius: 10px; padding: 8px 14px; font: inherit; font-size: .95rem; min-height: 44px; cursor: pointer; }

main { flex: 1; padding: 20px 16px 28px; display: flex; flex-direction: column; gap: 22px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.eyebrow { text-transform: uppercase; letter-spacing: .08em; font-weight: 700; font-size: .85rem; color: var(--muted); }
.backlink { color: var(--ink); font-size: 1rem; text-decoration: underline; text-underline-offset: 3px; align-self: flex-start; padding: 4px 0; }

.banner { background: var(--cream); color: var(--cream-ink); border-bottom: 1px solid var(--cream-line); padding: 10px 16px; display: flex; gap: 10px; align-items: center; font-size: .92rem; }
.banner button { margin-left: auto; background: none; border: 0; color: inherit; font: inherit; text-decoration: underline; min-height: 44px; cursor: pointer; }

/* home hero */
.hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 0 0 2px; }
.tagline { font-size: 1.55rem; line-height: 1.2; color: var(--navy); letter-spacing: -.01em; max-width: 18ch; }
:root[data-theme="dark"] .tagline { color: var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tagline { color: var(--ink); } }
.cta { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 58px; padding: 14px 18px; border-radius: 14px;
  background: var(--cta-1); color: #ffffff; font-weight: 700; font-size: 1.12rem; text-decoration: none; }
.cta:active { transform: translateY(1px); }


/* tiles */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
/* Category cards stay white; the colour lives in the icon badge and the edge. */
.tile { border: 1px solid var(--line); border-left: 5px solid var(--c, var(--line)); border-radius: var(--r);
  background: var(--page); color: var(--ink); padding: 12px 14px; min-height: 84px;
  display: flex; flex-direction: row; align-items: center; justify-content: flex-start; text-align: left;
  gap: 10px; min-width: 0; font: inherit; font-weight: 600; font-size: .98rem; cursor: pointer;
  text-decoration: none; line-height: 1.25; hyphens: manual; overflow-wrap: break-word; box-shadow: var(--shadow); }
.tile .lbl { min-width: 0; }
.tile[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--c, var(--ink)); }
/* the icon badge, shared by every category surface */
.tile-ico { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 12px; display: inline-flex;
  align-items: center; justify-content: center; background: var(--c-tint, var(--soft)); color: var(--c-ink, var(--ink)); }
.tile-ico .ico-svg { width: 23px; height: 23px; }
.ico-svg { width: 20px; height: 20px; flex: 0 0 auto; vertical-align: -4px; }
.btn .ico-svg { width: 19px; height: 19px; }
.h-ico { width: 22px; height: 22px; vertical-align: -4px; color: var(--muted); }

.c-housing { --c: var(--c-housing); --c-ink: var(--c-housing-ink); --c-tint: var(--c-housing-tint); }
.c-food { --c: var(--c-food); --c-ink: var(--c-food-ink); --c-tint: var(--c-food-tint); }
.c-clothing { --c: var(--c-clothing); --c-ink: var(--c-clothing-ink); --c-tint: var(--c-clothing-tint); }
.c-transport { --c: var(--c-transport); --c-ink: var(--c-transport-ink); --c-tint: var(--c-transport-tint); }
.c-docs { --c: var(--c-docs); --c-ink: var(--c-docs-ink); --c-tint: var(--c-docs-tint); }
.c-health { --c: var(--c-health); --c-ink: var(--c-health-ink); --c-tint: var(--c-health-tint); }
.c-youth { --c: var(--c-youth); --c-ink: var(--c-youth-ink); --c-tint: var(--c-youth-tint); }
.c-lifeskills { --c: var(--c-lifeskills); --c-ink: var(--c-lifeskills-ink); --c-tint: var(--c-lifeskills-tint); }
.c-seniors { --c: var(--c-seniors); --c-ink: var(--c-seniors-ink); --c-tint: var(--c-seniors-tint); }
.c-lgbtq { --c: var(--c-lgbtq); --c-ink: var(--c-lgbtq-ink); --c-tint: var(--c-lgbtq-tint); }
.c-library { --c: var(--c-library); --c-ink: var(--c-library-ink); --c-tint: var(--c-library-tint); }
.c-employment { --c: var(--c-employment); --c-ink: var(--c-employment-ink); --c-tint: var(--c-employment-tint); }
.c-iddocs { --c: var(--c-iddocs); --c-ink: var(--c-iddocs-ink); --c-tint: var(--c-iddocs-tint); }
.c-legal { --c: var(--c-legal); --c-ink: var(--c-legal-ink); --c-tint: var(--c-legal-tint); }
.c-education { --c: var(--c-education); --c-ink: var(--c-education-ink); --c-tint: var(--c-education-tint); }
.c-wraparound { --c: var(--c-wraparound); --c-ink: var(--c-wraparound-ink); --c-tint: var(--c-wraparound-tint); }
.c-family { --c: var(--c-family); --c-ink: var(--c-family-ink); --c-tint: var(--c-family-tint); }
.c-safety { --c: var(--c-safety); --c-ink: var(--c-safety-ink); --c-tint: var(--c-safety-tint); }
.c-jobs { --c: var(--c-jobs); --c-ink: var(--c-jobs-ink); --c-tint: var(--c-jobs-tint); }
.c-money { --c: var(--c-money); --c-ink: var(--c-money-ink); --c-tint: var(--c-money-tint); }
.c-reentry { --c: var(--c-reentry); --c-ink: var(--c-reentry-ink); --c-tint: var(--c-reentry-tint); }

.rtiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rtile { background: var(--page); color: var(--ink); border: 1px solid var(--line); border-top: 4px solid var(--c, var(--line));
  border-radius: var(--r); padding: 14px; text-align: left; font: inherit; display: flex; flex-direction: column;
  gap: 6px; cursor: pointer; text-decoration: none; min-height: 132px; box-shadow: var(--shadow); }
.rtile b { font-size: 1.02rem; }
.rtile span.d { font-size: .9rem; color: var(--muted); }
.rtile[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--c, var(--ink)); }

/* big landing cards */
.big { display: flex; gap: 14px; align-items: flex-start; padding: 16px; border-radius: var(--r); background: var(--soft); border: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.big .ico { font-size: 2rem; line-height: 1; flex: 0 0 auto; }
.big b { font-size: 1.12rem; display: block; margin-bottom: 2px; }
.big.cream { background: var(--cream); border-color: var(--cream-line); color: var(--cream-ink); }
.big.accent { background: var(--page); border-color: var(--line); border-left: 5px solid var(--c, var(--line)); align-items: center; }
.big.accent b { color: var(--ink); }

.callout { border-left: 4px solid var(--cream-ink); background: var(--soft); padding: 14px 16px; border-radius: 0 var(--r) var(--r) 0; }
.coming { border: 1px solid var(--cream-line); border-left: 5px solid var(--sun-2); background: var(--cream); color: var(--cream-ink); padding: 14px 16px; border-radius: var(--r); display: flex; flex-direction: column; gap: 4px; text-decoration: none; position: relative; }
.coming h2 { font-size: 1.15rem; }
.coming .x { position: absolute; top: 4px; right: 4px; background: none; border: 0; color: inherit; font-size: 1.3rem; width: 44px; height: 44px; cursor: pointer; }

/* inputs */
.field { display: flex; flex-direction: column; gap: 6px; }
input[type="search"], input[type="text"], input[type="tel"], select, textarea {
  width: 100%; font: inherit; color: var(--ink); background: var(--page); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; min-height: 48px;
}
textarea { min-height: 88px; resize: vertical; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chip { flex: 0 0 auto; border: 1.5px solid var(--line); background: var(--page); color: var(--ink); border-radius: 999px; padding: 8px 16px; font: inherit; font-size: .95rem; min-height: 44px; cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--navy); color: var(--navy-ink); border-color: var(--navy); }

/* cards */
.card { border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; background: var(--page); box-shadow: var(--shadow); }
.tag { align-self: flex-start; background: var(--chip-bg); border: 1px solid var(--chip-line); color: var(--chip-ink); border-radius: 999px; padding: 2px 12px; font-size: .88rem; font-weight: 600; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag.lg { background: var(--violet); border-color: var(--violet-line); color: var(--violet-ink); }

    reentry: { ids: ["wraparound"], label: "reentryTitle", route: "#/reentry" }
  };
  var CRISIS_LINES = {
    dv: { key: "askCrisisDV", phone: "1-800-799-7233", name: "National Domestic Violence Hotline" },
    suicide: { key: "askCrisisSuicide", phone: "988", name: "988 Suicide & Crisis Lifeline" },
    child: { key: "askCrisisChild", phone: "1-800-540-4000", name: "LA County Child Protection Hotline" }
  };

  /* Runs the interpreted question through the search the app already has. */
  function askFind(intent) {
    var ids = [], hasEmp = false;
    (intent.cats || []).forEach(function (c) {
      var m = ASK_MAP[c]; if (!m) return;
      m.ids.forEach(function (id) { if (ids.indexOf(id) < 0) ids.push(id); });
      if (m.emp) hasEmp = true;
    });
    var area = intent.zip ? zipArea(intent.zip) : null;
    var pt = area ? AREAS[area].p : null;
    var ws = tokens(intent.q || "");

    var res = [];
    /* the categories a listing is filed under, before page-specific topic lists */
    var extras = [];
    (intent.cats || []).forEach(function (c) { if (ASK_MAP[c] && ASK_MAP[c].extra && extras.indexOf(ASK_MAP[c].extra) < 0) extras.push(ASK_MAP[c].extra); });
    orgs().forEach(function (o) {
      var mine = [o.tag].concat(o.homeCats || [], o.reentryTiles || []);
      extras.forEach(function (f) { mine = mine.concat(o[f] || []); });
      var hit = ids.some(function (id) { return mine.indexOf(id) > -1; });
      /* nothing matched by category? fall back to the keyword search */
      if (!hit && !ids.length && ws.length) hit = matches(searchText(o), ws);
      if (!hit) return;
      var d = (pt && o.lat != null && o.addressMode !== "private" && o.addressMode !== "none") ? miles(pt, [o.lat, o.lng]) : null;
      var rank = 0;
      if (intent.reentry) rank = (o.reentry || (o.reentryTiles || []).length) ? 0 : 1;
      res.push({ o: o, d: d, rank: rank });
    });
    res.sort(function (a, b) {
      if (a.rank !== b.rank) return a.rank - b.rank;
      if (a.d == null && b.d == null) return 0;
      if (a.d == null) return 1;
      if (b.d == null) return -1;
      return a.d - b.d;
    });
    var emp = (hasEmp && intent.reentry) ? employers().slice(0, 3) : [];
    return { res: res, emp: emp, area: area };
  }

    var out = [];
    (intent.cats || []).forEach(function (c) { if (ASK_MAP[c]) out.push(t(ASK_MAP[c].label)); });

  /* ---- speech in, speech out (browser-native, optional, never required) ---- */
  function SR() { return window.SpeechRecognition || window.webkitSpeechRecognition || null; }
  function askStartMic() {
    var Rec = SR();
    if (!Rec) { S.askStatus = t("askMicNone"); render(); return; }
    if (S.askRec) { try { S.askRec.stop(); } catch (e) {} S.askRec = null; S.askStatus = ""; render(); return; }
    var rec = new Rec();
    rec.lang = S.lang === "es" ? "es-US" : "en-US";
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    rec.onresult = function (ev) {
      var said = ev.results && ev.results[0] && ev.results[0][0] ? ev.results[0][0].transcript : "";
      S.askRec = null; S.askStatus = "";
      if (said) { S.askQ = said; askRun(said); } else render();
    };
    rec.onerror = function (ev) {
      S.askRec = null;
      S.askStatus = (ev && (ev.error === "not-allowed" || ev.error === "service-not-allowed")) ? t("askMicDenied") : t("askMicError");
      render();
    };
    rec.onend = function () { if (S.askRec) { S.askRec = null; S.askStatus = ""; render(); } };
    try { rec.start(); S.askRec = rec; S.askStatus = t("askListening"); render(); }
    catch (e) { S.askRec = null; S.askStatus = t("askMicError"); render(); }
  }
  function askSpeak() {
    if (S.askRec) { try { S.askRec.stop(); } catch (e) {} S.askRec = null; S.askStatus = ""; }
    if (!("speechSynthesis" in window)) { S.askStatus = t("askListenNone"); render(); return; }
    if (S.askSpeaking) { window.speechSynthesis.cancel(); S.askSpeaking = false; render(); return; }
    if (!S.askIntent) return;
    var text = askSummary(S.askIntent, S.askCount || 0);
    if (S.askIntent.crisis && CRISIS_LINES[S.askIntent.crisis]) text = t(CRISIS_LINES[S.askIntent.crisis].key) + " " + text;
    var u = new SpeechSynthesisUtterance(text);
    u.lang = S.lang === "es" ? "es-US" : "en-US";
    u.onend = function () { S.askSpeaking = false; var b = document.querySelector('[data-act="asklisten"]'); if (b) b.setAttribute("aria-pressed", "false"); };
    S.askSpeaking = true;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
    render();
  }

  /* One question in, one intent out. Uses the serverless AI endpoint when the
     team has configured one; otherwise the on-device rules answer instantly. */
  function askRun(text) {
    var q = String(text == null ? (S.askQ || "") : text).trim();
    S.askQ = q; S.askShowAll = false;
    if (!q) { S.askIntent = null; render(); return; }
    var A = window.CLA_ASK;
    var endpoint = (window.CLA_CONFIG && window.CLA_CONFIG.askEndpoint) || "";
    var local = A.interpret(q); local.q = q;
    if (!endpoint) { S.askIntent = local; S.askBusy = false; render(); return; }
    S.askIntent = local; S.askBusy = true; render();
    A.remote(q, endpoint).then(function (intent) {
      intent.q = q; S.askIntent = intent; S.askBusy = false; render();
    });
  }

  /* ---------- sending to Airtable ----------
     The device copy is always written first, so nothing is lost if the phone is
     offline or the endpoint isn't configured. This just tries to add a row to
     the team's Airtable base as well, and marks the local copy when it lands. */
  function sendRecord(kind, record) {
    var endpoint = (window.CLA_CONFIG && window.CLA_CONFIG.reportEndpoint) || "";
    if (!endpoint || typeof fetch !== "function") return;
    var payload = {}; for (var k in record) payload[k] = record[k];
    payload.kind = kind; payload.lang = S.lang;
    var ctrl = typeof AbortController === "function" ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 8000);
    fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
      signal: ctrl ? ctrl.signal : undefined
    })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        clearTimeout(timer);
        if (!d || !d.ok) return;
        var key = kind === "feedback" ? "feedback" : (kind === "rating" ? "ratings" : "reports");
        var list = load(key, []);
        for (var i = 0; i < list.length; i++) if (list[i].id === record.id) list[i].sent = true;
        store(key, list);
      })
      .catch(function () { clearTimeout(timer); });
  }

     A person who actually called or walked in knows something our team can't

  /* Draws a QR matrix at `scale` pixels per module, with the 4-module quiet
     zone the spec requires — without it many scanners refuse to read. */
  function qrCanvas(text, scale) {
    var qr = window.CLA_QR.matrix(text), quiet = 4;
    var px = (qr.size + quiet * 2) * scale;
    var cv = document.createElement("canvas");
    cv.width = px; cv.height = px;
    var ctx = cv.getContext("2d");
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, px, px);
    ctx.fillStyle = "#111111";
    for (var r = 0; r < qr.size; r++) for (var c = 0; c < qr.size; c++) {
      if (qr.modules[r][c]) ctx.fillRect((c + quiet) * scale, (r + quiet) * scale, scale, scale);
    }
    return { canvas: cv, qr: qr };
  }

  function makeQr() {
    var url = document.getElementById("qrurl").value.trim();
    var box = document.getElementById("qrbox"), msg = document.getElementById("qrmsg");
    if (!url) { msg.textContent = "Paste the public link first."; return; }
    try {
      var out = qrCanvas(url, 6);
      box.innerHTML = ""; box.hidden = false;
      out.canvas.style.width = "240px"; out.canvas.style.height = "240px";
      out.canvas.setAttribute("role", "img");
      out.canvas.setAttribute("aria-label", "QR code for " + url);
      box.appendChild(out.canvas);
      msg.textContent = url + " · version " + out.qr.version + " · error correction Q";
      S.qrUrl = url;
      var dl = document.getElementById("qrdl"), pr = document.getElementById("qrprint");
      if (dl) { dl.hidden = false; dl.href = qrCanvas(url, 20).canvas.toDataURL("image/png"); dl.download = "connect-la-qr.png"; }
      if (pr) { pr.hidden = false; pr.href = "#/poster?u=" + encodeURIComponent(url); }
    } catch (e) {
      box.hidden = true;
      msg.textContent = e && e.message ? e.message : "Could not make a code from that link.";
    }
  }


  window.addEventListener("hashchange", onRoute);
  onRoute();
})();

</script>
